<style>
:root{--bg:#07060d;--bg2:#1a1030;--violet:#7a45f0;--lila:#cdb6ff;--plata:#b9bcc7;--txt:#efeaff;--muted:#a79cc4}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:Manrope,system-ui,sans-serif;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 38%,var(--bg2) 0%,var(--bg) 68%)}
#stage{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
.name{position:fixed;left:clamp(16px,4vw,48px);top:clamp(16px,4vh,40px);z-index:2}
.name h1{font:italic 400 clamp(2rem,6vw,3.6rem)/1 "Instrument Serif",Georgia,serif;color:var(--txt)}
.name p{margin-top:6px;color:var(--muted);font-size:.95rem}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
#caption{max-width:min(640px,92vw);min-height:3.2em;text-align:center;font-size:1.02rem;line-height:1.5;color:var(--txt);text-wrap:balance}
#status{font-size:.9rem;color:var(--muted)}
#talk{position:relative;border:0;cursor:pointer;font:600 1rem Manrope,sans-serif;color:#fff;background:var(--violet);padding:15px 30px;border-radius:999px;transition:transform .15s,background .2s}
#talk:hover{transform:scale(1.04)}
#talk:focus-visible{outline:3px solid var(--lila);outline-offset:4px}
#talk.live{background:#3b2a66}
#talk.live::after{content:"";position:absolute;inset:-6px;border-radius:999px;border:2px solid var(--lila);animation:ring 1.6s ease-out infinite}
@keyframes ring{from{opacity:.8;transform:scale(.96)}to{opacity:0;transform:scale(1.18)}}
@media (prefers-reduced-motion:reduce){#talk.live::after{animation:none}}
</style>

map.minFilter = THREE.LinearFilter; map.generateMipmaps = false; map.anisotropy = 8;

const uniforms = {
  map: { value: map }, uOpen: { value: 0 }, uBlink: { value: 0 }, uTime: { value: 0 },
  uGlow: { value: 0 }, uWide: { value: 0 }, uGaze: { value: new THREE.Vector2(0, 0) }, uDepth: { value: 0.6 }
};
const material = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false,
  vertexShader: `
    uniform float uDepth; varying vec2 vUv;
    void main(){
      vUv = uv; vec3 pos = position; vec2 p = uv * vec2(850.,700.);
      float face = exp(-pow((p.x-435.)/170.,2.) - pow((p.y-440.)/210.,2.));
      float neck = exp(-pow((p.x-450.)/120.,2.) - pow((p.y-230.)/110.,2.));
      pos.z += face * uDepth + neck * uDepth * 0.35;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    }`,
  fragmentShader: `
    uniform sampler2D map; uniform float uOpen, uBlink, uTime, uGlow, uWide; uniform vec2 uGaze; varying vec2 vUv;
    const vec2 SZ = vec2(850.,700.), M0 = vec2(435.,328.), EL = vec2(370.,457.), ER = vec2(494.,459.);
    vec4 tex(vec2 p){ return texture2D(map, p / SZ); }
    vec3 lid(vec2 E, vec2 p, vec3 base, float b){
      vec2 d = p - E;
      float inE = (1.-smoothstep(38.,46.,abs(d.x))) * (1.-smoothstep(15.,21.,abs(d.y)));
      float edge = 15. - 28.*b;
      float cover = smoothstep(edge-1.2, edge+1.2, d.y) * inE * smoothstep(0.02,0.12,b);
      vec3 skin = mix(tex(E + vec2(0.,19.)).rgb, tex(E + vec2(0.,42.)).rgb, 0.55) * 0.97;
      float lash = (1.-smoothstep(0.,2.6,abs(d.y-edge))) * inE * b;
      vec3 c = mix(base, skin, cover);
      return mix(c, vec3(.09,.05,.045), lash*0.85);
    }
    void main(){
      vec2 p = vUv * SZ, q = p;
      float t = M0.y - p.y, dx = p.x - M0.x, inM = 0., teeth = 0.;
      float gap = uOpen * 11.;
      float wx = exp(-dx*dx/(2.*46.*46.));
      float ring = exp(-pow((p.y - (M0.y - 8.))/34.,2.)) * exp(-dx*dx/(2.*70.*70.));
      q.x = M0.x + (q.x - M0.x) * (1. + (0.10 - 0.07*uWide) * uOpen * ring);
      if (t < 0. && gap > 0.6) q.y -= gap * 0.22 * wx * (1.-smoothstep(8.,24.,-t));
      if (t > 0. && gap > 0.6) {
        q.y += gap * wx * (1.-smoothstep(20.,62.,t));
        float hw = 30.*(1.-0.45*clamp(t/gap,0.,1.));
        inM = step(t, gap*wx) * (1.-smoothstep(hw-6.,hw,abs(dx)));
        teeth = (1.-smoothstep(0.,gap*0.4,t)) * smoothstep(6.,10.,gap);
      }
      vec4 c = tex(q);
      vec3 inside = mix(vec3(.17,.045,.06), vec3(.93,.89,.85), teeth*0.9);
      c.rgb = mix(c.rgb, inside, inM);
      c.rgb = lid(EL, p, c.rgb, uBlink);
      c.rgb = lid(ER, p, c.rgb, uBlink);
      // detalles luminosos violetas y azules, muy sutiles
      vec2 G[5]; G[0]=vec2(592.,484.); G[1]=vec2(581.,445.); G[2]=vec2(410.,222.); G[3]=vec2(500.,205.); G[4]=vec2(450.,170.);
      float g = 0.;
      for (int i=0;i<5;i++){ vec2 e = p - G[i]; g += exp(-dot(e,e)/(2.*5.5*5.5)) * (0.55 + 0.45*sin(uTime*1.8 + float(i)*1.7)); }
      vec3 gc = mix(vec3(.50,.30,1.0), vec3(.28,.52,1.0), 0.5 + 0.5*sin(uTime*0.7));
      c.rgb += gc * g * (0.28 + 0.5*uGlow) * step(0.5, c.a);
      float a = c.a * smoothstep(0.,110.,p.y) * smoothstep(0.,12.,p.x) * (1.-smoothstep(SZ.x-12.,SZ.x,p.x));
      gl_FragColor = vec4(c.rgb, a);
    }`
});
const portrait = new THREE.Mesh(new THREE.PlaneGeometry(PW, PH, 110, 90), material);
portrait.position.y = 0.55;
scene.add(portrait);

function resize() {
  const w = innerWidth, h = innerHeight, asp = w / h;
  renderer.setSize(w, h); camera.aspect = asp;
  const byH = PH / (0.536 * 0.72), byW = PW / (0.536 * asp * 0.96);
  camera.position.set(0, 0.35, Math.max(byH, byW));
  camera.lookAt(0, 0.35, 0);
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

/* ---------- Voz, labios, ojos y cabeza ---------- */
let convo = null, mode = "idle", open = 0, mx = 0, my = 0;
let nextBlink = 2, blinkT = -1, gx = 0, gy = 0, nextSaccade = 1.5, sx = 0, sy = 0;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
addEventListener("pointermove", e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; });

const clock = new THREE.Clock();
function frame() {
  const t = clock.getElapsedTime();
  let vol = 0;
  if (convo && mode === "speaking") {
    try { vol = convo.getOutputVolume(); } catch (e) { vol = 0; }
    if (vol < 0.02) vol = 0.14 + 0.12 * Math.abs(Math.sin(t * 9));   // respaldo si el volumen llega en 0
  }
  const target = Math.min(1, vol * 2.3 + (vol > 0.03 ? 0.08 * Math.sin(t * 13) : 0));
  open += (target - open) * 0.38;
  uniforms.uOpen.value = Math.max(0, open);
  uniforms.uWide.value = mode === "speaking" ? Math.sin(t * 5.7) * 0.8 : 0;

  // parpadeo
  if (blinkT < 0 && t > nextBlink) blinkT = 0;
  if (blinkT >= 0) {
    blinkT += 0.016;
    const k = blinkT / 0.17;
    uniforms.uBlink.value = k < 1 ? Math.sin(k * Math.PI) * 0.92 : 0;
    if (k >= 1) { blinkT = -1; nextBlink = t + 2.4 + Math.random() * 3.6; uniforms.uBlink.value = 0; }
  }
  // mirada: pequeños movimientos hacia el mouse
  if (t > nextSaccade) { sx = (Math.random() - .5) * 3; sy = (Math.random() - .5) * 2; nextSaccade = t + 1.2 + Math.random() * 2.8; }
  gx += ((mx * 7 + sx) - gx) * 0.12; gy += ((-my * 4 + sy) - gy) * 0.12;
  uniforms.uGaze.value.set(Math.max(-5, Math.min(5, gx)), Math.max(-3, Math.min(3, gy)));

  // cabeza: movimientos suaves
  const idle = reduce ? 0 : 1;
  const ty = mx * 0.30 + idle * Math.sin(t * 0.45) * 0.04;
  const tx = my * 0.14 + open * 0.035 + idle * Math.sin(t * 0.6) * 0.015;
  portrait.rotation.y += (ty - portrait.rotation.y) * 0.05;
  portrait.rotation.x += (tx - portrait.rotation.x) * 0.05;
  portrait.rotation.z = idle * Math.sin(t * 0.38) * 0.012;
  portrait.position.y = 0.55 + idle * Math.sin(t * 1.2) * 0.012;

  uniforms.uTime.value = t;
  uniforms.uGlow.value += ((mode === "speaking" ? open : 0) - uniforms.uGlow.value) * 0.1;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();

/* ---------- Conexión con el agente de ElevenLabs ---------- */
const btn = document.getElementById("talk"), statusEl = document.getElementById("status"), cap = document.getElementById("caption");
const say = s => (statusEl.textContent = s);

async function start() {
  btn.disabled = true; say("Conectando con Iris…");
  try {
    await navigator.mediaDevices.getUserMedia({ audio: true });
    convo = await Conversation.startSession({
      agentId: AGENT_ID,
      connectionType: "webrtc",
      onConnect: () => { btn.textContent = "Terminar"; btn.classList.add("live"); btn.disabled = false; say("Iris te escucha."); },
      onDisconnect: () => { convo = null; mode = "idle"; btn.textContent = "Hablar con Iris"; btn.classList.remove("live"); btn.disabled = false; say("Conversación terminada. Podés volver a hablar."); },
      onModeChange: m => { mode = m.mode; say(mode === "speaking" ? "Iris está hablando." : "Iris te escucha."); },
      onMessage: m => { if (m.source === "ai" || m.role === "agent") cap.textContent = m.message; },
      onError: e => { console.error(e); say("Hubo un error de conexión. Revisá internet y probá de nuevo."); }
    });
  } catch (e) {
    console.error(e); btn.disabled = false;
    say(e && e.name === "NotAllowedError" ? "Permití el micrófono en el navegador para hablar con Iris." : "No se pudo iniciar la conversación. Probá de nuevo.");
  }
}
btn.addEventListener("click", () => (convo ? convo.endSession() : start()));
</script>
</body>
</html>
